apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
      - name: telemedicine-service
        image: docker-telemedicine-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: common-secrets
              key: DB_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: common-secrets
              key: DB_PASS
        - name: agora_appId
          valueFrom:
            secretKeyRef:
              name: common-secrets
              key: AGORA_APP_ID
        - name: agora_certificate
          valueFrom:
            secretKeyRef:
              name: common-secrets
              key: AGORA_APP_CERTIFICATE
        - name: APPOINTMENT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: SERVICE_APPOINTMENT_URL
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "384Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-service
  namespace: smart-healthcare
spec:
  selector:
    app: telemedicine-service
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
  type: ClusterIP
---
