apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: docker-patient-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: common-secrets
              key: DB_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: common-secrets
              key: DB_PASS
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "384Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: smart-healthcare
spec:
  selector:
    app: patient-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
---
